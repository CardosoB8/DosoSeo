<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSO Vídeos - Player</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🔥 CLICKADILLA - Script do anúncio -->
    <script async src="https://js.wpadmngr.com/static/adManager.js" data-admpid="452853"></script>
    
    <style>
        /* ============================================================
           RESET E BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: linear-gradient(135deg, #0f1a2e, #1a2d4a);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(100, 181, 246, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #e50914;
            text-decoration: none;
        }

        .header .logo i {
            font-size: 26px;
        }

        .header .logo span {
            color: #64b5f6;
        }

        .header .back-link {
            color: #64b5f6;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(100, 181, 246, 0.08);
        }

        .header .back-link:hover {
            color: #e50914;
            background: rgba(229, 9, 20, 0.1);
        }

        /* ============================================================
           CONTEÚDO PRINCIPAL
           ============================================================ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        /* ============================================================
           PLAYER WRAPPER
           ============================================================ */
        .player-wrapper {
            background: #0a0f1a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(100, 181, 246, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
            position: relative;
        }

        .player-wrapper .player-container {
            position: relative;
            padding-top: 56.25%;
            background: #000;
        }

        .player-wrapper .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
           ANÚNCIO (CLICKADILLA)
           ============================================================ */
        #adContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0f1a;
            display: none;
            /* Inicialmente escondido */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #adContainer.visible {
            display: flex;
            opacity: 1;
        }

        #adContainer .ad-label {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            z-index: 11;
            letter-spacing: 0.5px;
        }

        /* 🔥 CONTAINER DO ANÚNCIO CLICKADILLA */
        .ad-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1a;
        }

        .ad-container iframe,
        .ad-container video,
        .ad-container img {
            max-width: 100%;
            max-height: 100%;
        }

        /* Loading - visível apenas enquanto carrega em segundo plano */
        .ad-loading {
            display: none;
            /* Escondido por padrão */;
        }

        /* ============================================================
           INFO DO VÍDEO
           ============================================================ */
        .video-info {
            padding: 20px 24px 24px;
            background: #14233a;
            border-top: 1px solid rgba(100, 181, 246, 0.06);
        }

        .video-info .title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .video-info .meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #78909c;
        }

        .video-info .meta .views i {
            color: #64b5f6;
            margin-right: 6px;
        }

        .video-info .meta .date i {
            color: #64b5f6;
            margin-right: 6px;
        }

        .video-info .meta .badge-views {
            background: rgba(229, 9, 14, 0.12);
            color: #e50914;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .video-info .description {
            color: #b0bec5;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ============================================================
           RECOMENDADOS
           ============================================================ */
        .related-section {
            margin-top: 32px;
        }

        .related-section .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e0e0e0;
        }

        .related-section .section-title i {
            color: #e50914;
            font-size: 20px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .related-card {
            background: #14233a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(100, 181, 246, 0.06);
        }

        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(229, 9, 20, 0.2);
        }

        .related-card .thumb {
            position: relative;
            padding-top: 56.25%;
            background: #0a0f1a;
        }

        .related-card .thumb img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-card .thumb .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(229, 9, 20, 0.85);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .related-card .thumb .play-icon i {
            color: #fff;
            font-size: 15px;
            margin-left: 2px;
        }

        .related-card:hover .thumb .play-icon {
            opacity: 1;
        }

        .related-card .info {
            padding: 10px 12px 12px;
        }

        .related-card .info h4 {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .related-card .info .views {
            font-size: 11px;
            color: #78909c;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .related-card .info .views i {
            font-size: 12px;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2d42;
            color: #e0e0e0;
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid rgba(100, 181, 246, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: toastFade 2.8s ease forwards;
            z-index: 999;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i {
            color: #4caf50;
            font-size: 18px;
        }

        .toast.error i {
            color: #e50914;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            12% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            gap: 16px;
            color: #78909c;
            font-size: 15px;
        }

        .loading-state i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #78909c;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: #2a3d5f;
        }

        .empty-state h4 {
            font-size: 17px;
            color: #b0bec5;
            margin-bottom: 4px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }
            .header .logo {
                font-size: 17px;
            }
            .header .logo i {
                font-size: 22px;
            }
            .header .back-link {
                font-size: 13px;
                padding: 4px 10px;
            }
            .container {
                padding: 12px 12px 40px;
            }
            .video-info {
                padding: 16px 16px 20px;
            }
            .video-info .title {
                font-size: 18px;
            }
            .video-info .meta {
                font-size: 13px;
                gap: 12px 16px;
            }
            .related-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .header .logo {
                font-size: 15px;
            }
            .header .back-link span {
                display: none;
            }
            .video-info .title {
                font-size: 16px;
            }
            .related-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            .related-card .info h4 {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="header">
        <a href="/videos" class="logo">
            <i class="fas fa-film"></i>
            DSO <span>Vídeos</span>
        </a>
        <a href="/videos" class="back-link">
            <i class="fas fa-arrow-left"></i>
            <span>Voltar para vídeos</span>
        </a>
    </header>

    <!-- ============================================================
    CONTEÚDO PRINCIPAL
    ============================================================ -->
    <div class="container">

        <!-- PLAYER -->
        <div class="player-wrapper" id="playerWrapper">
            <div class="player-container" id="playerContainer">

                <!-- 🔥 ANÚNCIO (CLICKADILLA) - INICIALMENTE ESCONDIDO -->
                <div id="adContainer">
                    <div class="ad-label">
                        <i class="fas fa-ad"></i> Anúncio
                    </div>

                    <!-- 🔥 CONTAINER DO CLICKADILLA (seletor .ad-container) -->
                    <div class="ad-container" id="clickadillaContainer"></div>
                </div>

                <!-- VÍDEO -->
                <iframe id="videoIframe" src="about:blank"
                        allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                </iframe>
            </div>

            <!-- INFO DO VÍDEO -->
            <div class="video-info" id="videoInfo">
                <div class="title" id="videoTitle">Carregando...</div>
                <div class="meta">
                    <span class="views" id="videoViews"><i class="fas fa-eye"></i> 0 visualizações</span>
                    <span class="date" id="videoDate"><i class="far fa-calendar-alt"></i> —</span>
                    <span class="badge-views" id="videoBadge">Carregando...</span>
                </div>
                <div class="description" id="videoDescription"></div>
            </div>
        </div>

        <!-- RECOMENDADOS -->
        <div class="related-section">
            <div class="section-title">
                <i class="fas fa-list-ul"></i> Recomendados para você
            </div>
            <div class="related-grid" id="relatedGrid">
                <div class="loading-state">
                    <i class="fas fa-spinner"></i> Carregando recomendados...
                </div>
            </div>
        </div>

    </div>

    <!-- TOAST -->
    <div id="toastContainer"></div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIG
            // ============================================================
            const CONFIG = {
                relatedLimit: 8,
                apiBase: '/api',
                adMaxDuration: 30,
                checkInterval: 300
            };

            // ============================================================
            // DOM REFS
            // ============================================================
            const $ = (sel) => document.querySelector(sel);
            const dom = {
                videoIframe: $('#videoIframe'),
                adContainer: $('#adContainer'),
                clickadillaContainer: $('#clickadillaContainer'),
                videoTitle: $('#videoTitle'),
                videoViews: $('#videoViews'),
                videoDate: $('#videoDate'),
                videoBadge: $('#videoBadge'),
                videoDescription: $('#videoDescription'),
                relatedGrid: $('#relatedGrid'),
                toastContainer: $('#toastContainer')
            };

            // ============================================================
            // ESTADO
            // ============================================================
            let adSkipped = false;
            let adCompleted = false;
            let adLoaded = false;
            let adShown = false;
            let checkIntervalId = null;
            let videoUrl = '';
            let videoData = null;
            let adStartTime = 0;

            // ============================================================
            // TOAST
            // ============================================================
            function showToast(message, isError = false) {
                const toast = document.createElement('div');
                toast.className = `toast ${isError ? 'error' : ''}`;
                toast.innerHTML =
                `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
                dom.toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 2800);
            }

            // ============================================================
            // FORMATADORES
            // ============================================================
            function formatViews(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
                return num.toString();
            }

            function formatDate(iso) {
                if (!iso) return '—';
                const d = new Date(iso);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function getVideoIdFromUrl() {
                const path = window.location.pathname;
                const parts = path.split('/');
                return parts[parts.length - 1] || null;
            }

            // ============================================================
            // SILENCIAR ANÚNCIO (remove áudio)
            // ============================================================
            function muteAdAudio() {
                console.log('🔇 Tentando silenciar anúncio...');

                // Método 1: Remover elementos de áudio/vídeo dentro do container
                const container = dom.clickadillaContainer;
                const videos = container.querySelectorAll('video');
                const audios = container.querySelectorAll('audio');
                const iframes = container.querySelectorAll('iframe');

                videos.forEach(v => {
                    try {
                        v.muted = true;
                        v.pause();
                        console.log('🔇 Vídeo mutado');
                    } catch (e) {}
                });

                audios.forEach(a => {
                    try {
                        a.muted = true;
                        a.pause();
                        console.log('🔇 Áudio mutado');
                    } catch (e) {}
                });

                // Método 2: Tentar remover o elemento do anúncio (mais drástico)
                // Alguns anúncios usam iframes com áudio
                iframes.forEach(iframe => {
                    try {
                        // Tentar acessar o conteúdo do iframe e mutar
                        try {
                            const doc = iframe.contentDocument || iframe.contentWindow?.document;
                            if (doc) {
                                const v = doc.querySelectorAll('video');
                                v.forEach(el => { el.muted = true;
                                    el.pause(); });
                                const a = doc.querySelectorAll('audio');
                                a.forEach(el => { el.muted = true;
                                    el.pause(); });
                            }
                        } catch (e) {
                            // CORS - não podemos acessar o iframe
                            console.log('⚠️ Não foi possível acessar iframe (CORS)');
                        }
                    } catch (e) {}
                });

                // Método 3: Recarregar o container (remove o anúncio completamente)
                // Isso pode ser feito se o anúncio não puder ser silenciado
                // container.innerHTML = '';
                // console.log('🔇 Container limpo');
            }

            // ============================================================
            // INICIAR ANÚNCIO CLICKADILLA (EM SEGUNDO PLANO)
            // ============================================================
            function startClickadillaAd() {
                console.log('📢 Iniciando Clickadilla em segundo plano...');

                // Resetar estado
                adSkipped = false;
                adCompleted = false;
                adLoaded = false;
                adShown = false;
                adStartTime = Date.now();

                // Mostrar vídeo (por enquanto)
                dom.videoIframe.src = 'about:blank';
                dom.videoIframe.style.display = 'block';

                // Esconder container do anúncio inicialmente
                dom.adContainer.classList.remove('visible');
                dom.adContainer.style.display = 'none';

                // Limpar container do anúncio
                dom.clickadillaContainer.innerHTML = '';

                // O Clickadilla vai injetar o anúncio no .ad-container
                // O script já está carregado no <head>

                // 🔥 MONITORAR SE O ANÚNCIO FOI CARREGADO
                let checkCount = 0;
                const maxChecks = 40; // ~12 segundos

                if (checkIntervalId) clearInterval(checkIntervalId);

                checkIntervalId = setInterval(() => {
                    checkCount++;

                    const hasContent = dom.clickadillaContainer.children.length > 0;
                    const hasIframe = dom.clickadillaContainer.querySelector('iframe') !== null;
                    const hasVideo = dom.clickadillaContainer.querySelector('video') !== null;
                    const hasImg = dom.clickadillaContainer.querySelector('img') !== null;

                    // Verificar se o container tem conteúdo visível
                    const containerStyle = window.getComputedStyle(dom.clickadillaContainer);
                    const isVisible = containerStyle.display !== 'none' && containerStyle.opacity !== '0';

                    if (hasContent || hasIframe || hasVideo || hasImg) {
                        // Anúncio carregou!
                        adLoaded = true;
                        clearInterval(checkIntervalId);
                        checkIntervalId = null;

                        console.log('✅ Clickadilla carregou o anúncio!');

                        // 🔥 MOSTRAR O ANÚNCIO AGORA
                        showAd();

                        // 🔥 MONITORAR QUANDO O ANÚNCIO TERMINAR
                        monitorAdCompletion();

                        return;
                    }

                    // Se passou do tempo máximo, pular
                    if (checkCount >= maxChecks) {
                        clearInterval(checkIntervalId);
                        checkIntervalId = null;
                        console.log('⏰ Clickadilla não carregou em tempo hábil, pulando...');
                        // Não mostrar anúncio, ir direto para o vídeo
                        playVideoDirectly();
                    }
                }, CONFIG.checkInterval);

                // Fallback: se passar 15 segundos e não carregou
                setTimeout(() => {
                    if (!adLoaded && !adSkipped && !adCompleted) {
                        clearInterval(checkIntervalId);
                        checkIntervalId = null;
                        console.log('⏰ Timeout do anúncio (15s), pulando...');
                        playVideoDirectly();
                    }
                }, 15000);
            }

            // ============================================================
            // MOSTRAR ANÚNCIO (quando carregado)
            // ============================================================
            function showAd() {
                if (adShown) return;
                adShown = true;
                adStartTime = Date.now();

                console.log('🎬 Mostrando anúncio...');

                // Esconder o vídeo
                dom.videoIframe.style.display = 'none';

                // Mostrar o anúncio com transição suave
                dom.adContainer.style.display = 'flex';
                // Forçar reflow para a transição funcionar
                void dom.adContainer.offsetWidth;
                dom.adContainer.classList.add('visible');

                // Registrar que o anúncio começou
                console.log('📢 Anúncio em exibição');
            }

            // ============================================================
            // MONITORAR QUANDO O ANÚNCIO TERMINA
            // ============================================================
            function monitorAdCompletion() {
                // Verificar periodicamente se o anúncio ainda está lá
                let monitorCount = 0;
                const monitorInterval = setInterval(() => {
                    monitorCount++;

                    // Verificar se o container ainda tem conteúdo
                    const hasContent = dom.clickadillaContainer.children.length > 0;
                    const containerDisplay = window.getComputedStyle(dom.clickadillaContainer).display;

                    // Se o container está vazio ou escondido, o anúncio terminou
                    if (!hasContent || containerDisplay === 'none') {
                        if (!adSkipped && !adCompleted) {
                            console.log('✅ Anúncio terminou (container vazio)');
                            adCompleted = true;
                            clearInterval(monitorInterval);
                            hideAdAndPlayVideo();
                        }
                        return;
                    }

                    // Verificar se passou do tempo máximo
                    const elapsed = (Date.now() - adStartTime) / 1000;
                    if (elapsed > CONFIG.adMaxDuration) {
                        if (!adSkipped && !adCompleted) {
                            console.log('⏰ Tempo máximo do anúncio atingido');
                            adCompleted = true;
                            clearInterval(monitorInterval);
                            hideAdAndPlayVideo();
                        }
                        return;
                    }

                    // Verificar se o usuário interagiu com o skip do Clickadilla
                    // Não temos como detectar diretamente, então usamos o tempo
                }, 500);

                // Fallback: após 30 segundos, forçar término
                setTimeout(() => {
                    if (!adSkipped && !adCompleted) {
                        console.log('⏰ Forçando término do anúncio (timeout final)');
                        adCompleted = true;
                        clearInterval(monitorInterval);
                        hideAdAndPlayVideo();
                    }
                }, CONFIG.adMaxDuration * 1000 + 2000);
            }

            // ============================================================
            // PULAR ANÚNCIO (chamado pelo usuário ou automaticamente)
            // ============================================================
            function skipAd() {
                if (adSkipped || adCompleted) return;
                adSkipped = true;

                console.log('⏭️ Pulando anúncio...');

                // 🔥 SILENCIAR O ÁUDIO DO ANÚNCIO
                muteAdAudio();

                // Esconder o anúncio e mostrar o vídeo
                hideAdAndPlayVideo();

                // Limpar intervalo de monitoramento
                if (checkIntervalId) {
                    clearInterval(checkIntervalId);
                    checkIntervalId = null;
                }
            }

            // ============================================================
            // REPRODUZIR VÍDEO DIRETAMENTE (sem anúncio)
            // ============================================================
            function playVideoDirectly() {
                if (adSkipped || adCompleted) return;
                adSkipped = true;
                console.log('▶️ Reproduzindo vídeo diretamente (sem anúncio)');
                hideAdAndPlayVideo();
            }

            // ============================================================
            // ESCONDER ANÚNCIO E REPRODUZIR VÍDEO
            // ============================================================
            function hideAdAndPlayVideo() {
                // Esconder anúncio
                dom.adContainer.classList.remove('visible');
                dom.adContainer.style.display = 'none';

                // Mostrar vídeo
                dom.videoIframe.style.display = 'block';

                // Carregar o vídeo (se ainda não foi carregado)
                if (dom.videoIframe.src === 'about:blank' || dom.videoIframe.src === '') {
                    dom.videoIframe.src = videoUrl;
                } else if (dom.videoIframe.src !== videoUrl) {
                    // Recarregar se for URL diferente
                    dom.videoIframe.src = videoUrl;
                }

                console.log('▶️ Vídeo iniciado!');
            }

            // ============================================================
            // CARREGAR VÍDEO
            // ============================================================
            async function loadVideo(videoId) {
                try {
                    const resp = await fetch(`${CONFIG.apiBase}/video/${videoId}`);
                    if (!resp.ok) {
                        if (resp.status === 404) throw new Error('Vídeo não encontrado');
                        throw new Error('Erro ao carregar vídeo');
                    }

                    videoData = await resp.json();

                    // Preencher informações
                    dom.videoTitle.textContent = videoData.titulo || 'Sem título';
                    dom.videoViews.innerHTML =
                        `<i class="fas fa-eye"></i> ${formatViews(videoData.views || 0)} visualizações`;
                    dom.videoDate.innerHTML = `<i class="far fa-calendar-alt"></i> ${formatDate(videoData.criado_em)}`;
                    dom.videoBadge.textContent = `${formatViews(videoData.views || 0)} views`;
                    dom.videoDescription.textContent = videoData.descricao || '';

                    // Definir URL do vídeo
                    if (videoData.streamable_url) {
                        videoUrl = videoData.streamable_url;
                    } else if (videoData.embed_url) {
                        videoUrl = videoData.embed_url;
                    } else if (videoData.youtube_id) {
                        videoUrl =
                            `https://www.youtube.com/embed/${videoData.youtube_id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3`;
                    } else {
                        videoUrl = videoData.video_url || '';
                    }

                    console.log('🎬 URL do vídeo:', videoUrl);

                    // 🔥 INICIAR O FLUXO: ANÚNCIO EM SEGUNDO PLANO → VÍDEO
                    startClickadillaAd();

                    // Registrar view
                    await registerView(videoId);

                    // Carregar recomendados
                    await loadRelated(videoId);

                    return videoData;

                } catch (err) {
                    console.error('Erro loadVideo:', err);
                    dom.videoTitle.textContent = 'Erro ao carregar vídeo';
                    dom.videoDescription.textContent = err.message || 'Tente novamente mais tarde.';
                    dom.adContainer.innerHTML = `
                        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#e50914;gap:12px;padding:20px;">
                            <i class="fas fa-exclamation-triangle" style="font-size:40px;"></i>
                            <span>${err.message || 'Erro ao carregar'}</span>
                            <button onclick="location.reload()" style="padding:10px 24px;background:#e50914;border:none;border-radius:20px;color:#fff;cursor:pointer;font-weight:600;">Tentar novamente</button>
                        </div>
                    `;
                    dom.adContainer.style.display = 'flex';
                    dom.adContainer.classList.add('visible');
                    showToast('Erro ao carregar vídeo', true);
                    return null;
                }
            }

            // ============================================================
            // REGISTRAR VIEW
            // ============================================================
            async function registerView(videoId) {
                try {
                    const resp = await fetch(`${CONFIG.apiBase}/video/${videoId}/view`, {
                        method: 'POST'
                    });
                    if (!resp.ok) throw new Error('Erro ao registrar view');

                    const data = await resp.json();
                    if (data.views) {
                        dom.videoViews.innerHTML =
                            `<i class="fas fa-eye"></i> ${formatViews(data.views)} visualizações`;
                        dom.videoBadge.textContent = `${formatViews(data.views)} views`;
                    }
                } catch (err) {
                    console.warn('Erro ao registrar view:', err);
                }
            }

            // ============================================================
            // CARREGAR RECOMENDADOS
            // ============================================================
            async function loadRelated(videoId) {
                dom.relatedGrid.innerHTML = `
                    <div class="loading-state">
                        <i class="fas fa-spinner"></i> Carregando recomendados...
                    </div>
                `;

                try {
                    const resp = await fetch(`${CONFIG.apiBase}/videos/popular?limit=${CONFIG.relatedLimit}`);
                    if (!resp.ok) throw new Error('Erro ao carregar recomendados');

                    const data = await resp.json();
                    const videos = data.videos || [];
                    const filtered = videos.filter(v => v.id !== videoId);

                    if (filtered.length === 0) {
                        dom.relatedGrid.innerHTML = `
                            <div class="empty-state" style="grid-column:1/-1;">
                                <i class="fas fa-info-circle"></i>
                                <h4>Sem recomendações</h4>
                                <p>Volte mais tarde para mais vídeos.</p>
                            </div>
                        `;
                        return;
                    }

                    const fragment = document.createDocumentFragment();
                    filtered.forEach(v => {
                        const card = document.createElement('div');
                        card.className = 'related-card';
                        card.dataset.id = v.id;

                        let thumb = v.thumbnail || '';
                        if (!thumb || thumb.includes('dQw4w9WgXcQ')) {
                            if (v.isStreamable) {
                                thumb = 'https://placehold.co/320x180/1a2d42/64b5f6?text=Streamable';
                            } else {
                                thumb = 'https://placehold.co/320x180/1a2d42/64b5f6?text=DSO';
                            }
                        }

                        card.innerHTML = `
                            <div class="thumb">
                                <img src="${thumb}" 
                                     alt="${v.titulo || 'Vídeo'}"
                                     loading="lazy"
                                     onerror="this.src='https://placehold.co/320x180/1a2d42/64b5f6?text=DSO'">
                                <div class="play-icon"><i class="fas fa-play"></i></div>
                            </div>
                            <div class="info">
                                <h4>${v.titulo || 'Sem título'}</h4>
                                <div class="views">
                                    <i class="fas fa-eye"></i> ${formatViews(v.views || 0)}
                                </div>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            window.location.href = `/video/${v.id}`;
                        });
                        fragment.appendChild(card);
                    });

                    dom.relatedGrid.innerHTML = '';
                    dom.relatedGrid.appendChild(fragment);

                } catch (err) {
                    console.error('Erro loadRelated:', err);
                    dom.relatedGrid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <i class="fas fa-exclamation-triangle" style="color:#ff9800;"></i>
                            <h4>Erro ao carregar recomendações</h4>
                            <p>Tente novamente mais tarde.</p>
                        </div>
                    `;
                }
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            async function init() {
                const videoId = getVideoIdFromUrl();

                if (!videoId) {
                    dom.videoTitle.textContent = 'ID do vídeo não encontrado';
                    dom.videoDescription.textContent = 'URL inválida. Volte para a lista de vídeos.';
                    dom.adContainer.innerHTML = `
                        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#ff9800;gap:12px;padding:20px;">
                            <i class="fas fa-exclamation-triangle" style="font-size:40px;"></i>
                            <span>ID do vídeo não encontrado</span>
                            <a href="/videos" style="color:#64b5f6;text-decoration:none;">Voltar para a lista</a>
                        </div>
                    `;
                    dom.adContainer.style.display = 'flex';
                    dom.adContainer.classList.add('visible');
                    dom.relatedGrid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <i class="fas fa-info-circle"></i>
                            <h4>Nenhum vídeo selecionado</h4>
                            <p><a href="/videos" style="color:#64b5f6;text-decoration:none;">Voltar para a lista</a></p>
                        </div>
                    `;
                    return;
                }

                // Carregar vídeo
                await loadVideo(videoId);
            }

            // Iniciar
            init();

            // Expor para debug
            window.__videoPlayer = { loadVideo, loadRelated, registerView, skipAd, muteAdAudio };

        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSO Vídeos - Player</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🔥 CLICKADILLA - Script do anúncio -->
    <script async src="https://js.wpadmngr.com/static/adManager.js" data-admpid="452853"></script>
    
    <style>
        /* ============================================================
           RESET E BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: linear-gradient(135deg, #0f1a2e, #1a2d4a);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(100, 181, 246, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #e50914;
            text-decoration: none;
        }

        .header .logo i {
            font-size: 26px;
        }

        .header .logo span {
            color: #64b5f6;
        }

        .header .back-link {
            color: #64b5f6;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(100, 181, 246, 0.08);
        }

        .header .back-link:hover {
            color: #e50914;
            background: rgba(229, 9, 20, 0.1);
        }

        /* ============================================================
           CONTEÚDO PRINCIPAL
           ============================================================ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        /* ============================================================
           PLAYER WRAPPER
           ============================================================ */
        .player-wrapper {
            background: #0a0f1a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(100, 181, 246, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
            position: relative;
        }

        .player-wrapper .player-container {
            position: relative;
            padding-top: 56.25%;
            background: #000;
        }

        .player-wrapper .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
           ANÚNCIO (CLICKADILLA)
           ============================================================ */
        #adContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #adContainer .ad-label {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            z-index: 11;
            letter-spacing: 0.5px;
        }

        #adContainer .ad-skip {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            z-index: 11;
            font-weight: 600;
            display: none;
        }

        #adContainer .ad-skip:hover {
            background: rgba(229, 9, 20, 0.8);
            border-color: #e50914;
        }

        #adContainer .ad-skip.show {
            display: block;
        }

        #adContainer .ad-timer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 11;
        }

        /* 🔥 CONTAINER DO ANÚNCIO CLICKADILLA */
        .ad-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1a;
        }

        .ad-container iframe,
        .ad-container video,
        .ad-container img {
            max-width: 100%;
            max-height: 100%;
        }

        /* Loading do anúncio */
        .ad-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #78909c;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0f1a;
            z-index: 1;
        }

        .ad-loading i {
            font-size: 40px;
            animation: spin 1s linear infinite;
            color: #64b5f6;
        }

        .ad-loading span {
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           INFO DO VÍDEO
           ============================================================ */
        .video-info {
            padding: 20px 24px 24px;
            background: #14233a;
            border-top: 1px solid rgba(100, 181, 246, 0.06);
        }

        .video-info .title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .video-info .meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #78909c;
        }

        .video-info .meta .views i {
            color: #64b5f6;
            margin-right: 6px;
        }

        .video-info .meta .date i {
            color: #64b5f6;
            margin-right: 6px;
        }

        .video-info .meta .badge-views {
            background: rgba(229, 9, 14, 0.12);
            color: #e50914;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .video-info .description {
            color: #b0bec5;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ============================================================
           RECOMENDADOS
           ============================================================ */
        .related-section {
            margin-top: 32px;
        }

        .related-section .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e0e0e0;
        }

        .related-section .section-title i {
            color: #e50914;
            font-size: 20px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .related-card {
            background: #14233a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(100, 181, 246, 0.06);
        }

        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(229, 9, 20, 0.2);
        }

        .related-card .thumb {
            position: relative;
            padding-top: 56.25%;
            background: #0a0f1a;
        }

        .related-card .thumb img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-card .thumb .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(229, 9, 20, 0.85);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .related-card .thumb .play-icon i {
            color: #fff;
            font-size: 15px;
            margin-left: 2px;
        }

        .related-card:hover .thumb .play-icon {
            opacity: 1;
        }

        .related-card .info {
            padding: 10px 12px 12px;
        }

        .related-card .info h4 {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .related-card .info .views {
            font-size: 11px;
            color: #78909c;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .related-card .info .views i {
            font-size: 12px;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2d42;
            color: #e0e0e0;
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid rgba(100, 181, 246, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: toastFade 2.8s ease forwards;
            z-index: 999;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i {
            color: #4caf50;
            font-size: 18px;
        }

        .toast.error i {
            color: #e50914;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            12% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }
            .header .logo {
                font-size: 17px;
            }
            .header .logo i {
                font-size: 22px;
            }
            .header .back-link {
                font-size: 13px;
                padding: 4px 10px;
            }
            .container {
                padding: 12px 12px 40px;
            }
            .video-info {
                padding: 16px 16px 20px;
            }
            .video-info .title {
                font-size: 18px;
            }
            .video-info .meta {
                font-size: 13px;
                gap: 12px 16px;
            }
            .related-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .header .logo {
                font-size: 15px;
            }
            .header .back-link span {
                display: none;
            }
            .video-info .title {
                font-size: 16px;
            }
            .related-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            .related-card .info h4 {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="header">
        <a href="/videos" class="logo">
            <i class="fas fa-film"></i>
            DSO <span>Vídeos</span>
        </a>
        <a href="/videos" class="back-link">
            <i class="fas fa-arrow-left"></i>
            <span>Voltar para vídeos</span>
        </a>
    </header>

    <!-- ============================================================
    CONTEÚDO PRINCIPAL
    ============================================================ -->
    <div class="container">

        <!-- PLAYER -->
        <div class="player-wrapper" id="playerWrapper">
            <div class="player-container" id="playerContainer">
                
                <!-- 🔥 ANÚNCIO (CLICKADILLA) -->
                <div id="adContainer">
                    <div class="ad-label">
                        <i class="fas fa-ad"></i> Anúncio
                    </div>
                    
                    <!-- Loading do anúncio -->
                    <div class="ad-loading" id="adLoading">
                        <i class="fas fa-spinner"></i>
                        <span>Carregando anúncio...</span>
                    </div>
                    
                    <!-- 🔥 CONTAINER DO CLICKADILLA (seletor .ad-container) -->
                    <div class="ad-container" id="clickadillaContainer"></div>
                    
                    <div class="ad-timer" id="adTimer">⏱️ 5s</div>
                    <button class="ad-skip" id="adSkipBtn">⏭️ Pular</button>
                </div>
                
                <!-- VÍDEO -->
                <iframe id="videoIframe"
                        src="about:blank"
                        allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                </iframe>
            </div>

            <!-- INFO DO VÍDEO -->
            <div class="video-info" id="videoInfo">
                <div class="title" id="videoTitle">Carregando...</div>
                <div class="meta">
                    <span class="views" id="videoViews"><i class="fas fa-eye"></i> 0 visualizações</span>
                    <span class="date" id="videoDate"><i class="far fa-calendar-alt"></i> —</span>
                    <span class="badge-views" id="videoBadge">Carregando...</span>
                </div>
                <div class="description" id="videoDescription"></div>
            </div>
        </div>

        <!-- RECOMENDADOS -->
        <div class="related-section">
            <div class="section-title">
                <i class="fas fa-list-ul"></i> Recomendados para você
            </div>
            <div class="related-grid" id="relatedGrid">
                <div class="loading-state">
                    <i class="fas fa-spinner"></i> Carregando recomendados...
                </div>
            </div>
        </div>

    </div>

    <!-- TOAST -->
    <div id="toastContainer"></div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIG
            // ============================================================
            const CONFIG = {
                relatedLimit: 8,
                apiBase: '/api',
                adSkipTime: 5, // segundos até o botão "Pular" aparecer
                adMaxDuration: 20 // duração máxima do anúncio em segundos
            };

            // ============================================================
            // DOM REFS
            // ============================================================
            const $ = (sel) => document.querySelector(sel);
            const dom = {
                videoIframe: $('#videoIframe'),
                adContainer: $('#adContainer'),
                adLoading: $('#adLoading'),
                clickadillaContainer: $('#clickadillaContainer'),
                adTimer: $('#adTimer'),
                adSkipBtn: $('#adSkipBtn'),
                videoTitle: $('#videoTitle'),
                videoViews: $('#videoViews'),
                videoDate: $('#videoDate'),
                videoBadge: $('#videoBadge'),
                videoDescription: $('#videoDescription'),
                relatedGrid: $('#relatedGrid'),
                toastContainer: $('#toastContainer')
            };

            // ============================================================
            // ESTADO
            // ============================================================
            let adSkipped = false;
            let adCompleted = false;
            let adTimerInterval = null;
            let adCountdown = CONFIG.adSkipTime;
            let videoUrl = '';
            let videoData = null;
            let adLoaded = false;
            let adStarted = false;

            // ============================================================
            // TOAST
            // ============================================================
            function showToast(message, isError = false) {
                const toast = document.createElement('div');
                toast.className = `toast ${isError ? 'error' : ''}`;
                toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
                dom.toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 2800);
            }

            // ============================================================
            // FORMATADORES
            // ============================================================
            function formatViews(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
                return num.toString();
            }

            function formatDate(iso) {
                if (!iso) return '—';
                const d = new Date(iso);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function getVideoIdFromUrl() {
                const path = window.location.pathname;
                const parts = path.split('/');
                return parts[parts.length - 1] || null;
            }

            // ============================================================
            // GERENCIAMENTO DE ANÚNCIOS (CLICKADILLA)
            // ============================================================
            function startAdTimer() {
                adCountdown = CONFIG.adSkipTime;
                dom.adSkipBtn.classList.remove('show');
                dom.adTimer.textContent = `⏱️ ${adCountdown}s`;
                
                clearInterval(adTimerInterval);
                adTimerInterval = setInterval(() => {
                    adCountdown--;
                    if (adCountdown > 0) {
                        dom.adTimer.textContent = `⏱️ ${adCountdown}s`;
                    } else {
                        dom.adTimer.textContent = '⏱️ Pular';
                        dom.adSkipBtn.classList.add('show');
                        clearInterval(adTimerInterval);
                    }
                }, 1000);
            }

            function skipAd() {
                if (adSkipped || adCompleted) return;
                adSkipped = true;
                clearInterval(adTimerInterval);
                console.log('⏭️ Anúncio pulado');
                hideAdAndPlayVideo();
            }

            function completeAd() {
                if (adCompleted) return;
                adCompleted = true;
                clearInterval(adTimerInterval);
                console.log('✅ Anúncio concluído');
                hideAdAndPlayVideo();
            }

            function hideAdAndPlayVideo() {
                dom.adContainer.style.display = 'none';
                dom.videoIframe.src = videoUrl;
                dom.videoIframe.style.display = 'block';
            }

            // 🔥 INICIAR ANÚNCIO CLICKADILLA
            function startClickadillaAd() {
                console.log('📢 Iniciando Clickadilla...');
                adStarted = true;
                
                // Mostrar container do anúncio
                dom.adContainer.style.display = 'flex';
                dom.videoIframe.src = 'about:blank';
                dom.videoIframe.style.display = 'none';
                
                // Mostrar loading
                dom.adLoading.style.display = 'flex';
                
                // Iniciar timer
                startAdTimer();
                
                // 🔥 O Clickadilla vai injetar o anúncio no .ad-container
                // O script já está carregado no <head>
                // Ele procura pelo seletor .ad-container definido no AD Code
                
                // Aguardar o Clickadilla injetar o anúncio
                // O Clickadilla injeta um iframe ou video dentro do .ad-container
                
                // Monitorar se o anúncio foi carregado
                let checkCount = 0;
                const checkInterval = setInterval(() => {
                    checkCount++;
                    
                    // Verificar se o Clickadilla injetou algo no container
                    const hasContent = dom.clickadillaContainer.children.length > 0;
                    const hasIframe = dom.clickadillaContainer.querySelector('iframe') !== null;
                    const hasVideo = dom.clickadillaContainer.querySelector('video') !== null;
                    
                    if (hasContent || hasIframe || hasVideo) {
                        adLoaded = true;
                        clearInterval(checkInterval);
                        dom.adLoading.style.display = 'none';
                        console.log('✅ Clickadilla carregou o anúncio!');
                        
                        // Tentar detectar quando o anúncio termina
                        // Clickadilla geralmente mostra um vídeo ou overlay
                        // Vamos monitorar se o elemento foi removido ou se o vídeo terminou
                        
                        // Se for um iframe, não temos controle direto
                        // Vamos usar o timeout máximo
                        setTimeout(() => {
                            if (!adSkipped && !adCompleted) {
                                console.log('⏰ Anúncio finalizado (timeout)');
                                completeAd();
                            }
                        }, CONFIG.adMaxDuration * 1000);
                    }
                    
                    // Se passou 10 segundos e não carregou, pular
                    if (checkCount > 20) {
                        clearInterval(checkInterval);
                        if (!adLoaded) {
                            console.log('⚠️ Clickadilla não carregou em 10s, pulando...');
                            dom.adLoading.innerHTML = `
                                <i class="fas fa-exclamation-triangle" style="color:#ff9800;"></i>
                                <span>Anúncio não disponível</span>
                            `;
                            setTimeout(() => {
                                if (!adSkipped && !adCompleted) {
                                    skipAd();
                                }
                            }, 2000);
                        }
                    }
                }, 500);
                
                // Fallback: se o anúncio não carregar em 15 segundos, pular
                setTimeout(() => {
                    if (!adSkipped && !adCompleted && !adLoaded) {
                        console.log('⏰ Timeout do anúncio, pulando...');
                        skipAd();
                    }
                }, 15000);
            }

            // ============================================================
            // CARREGAR VÍDEO
            // ============================================================
            async function loadVideo(videoId) {
                try {
                    const resp = await fetch(`${CONFIG.apiBase}/video/${videoId}`);
                    if (!resp.ok) {
                        if (resp.status === 404) throw new Error('Vídeo não encontrado');
                        throw new Error('Erro ao carregar vídeo');
                    }

                    videoData = await resp.json();

                    // Preencher informações
                    dom.videoTitle.textContent = videoData.titulo || 'Sem título';
                    dom.videoViews.innerHTML = `<i class="fas fa-eye"></i> ${formatViews(videoData.views || 0)} visualizações`;
                    dom.videoDate.innerHTML = `<i class="far fa-calendar-alt"></i> ${formatDate(videoData.criado_em)}`;
                    dom.videoBadge.textContent = `${formatViews(videoData.views || 0)} views`;
                    dom.videoDescription.textContent = videoData.descricao || '';

                    // Definir URL do vídeo
                    if (videoData.streamable_url) {
                        videoUrl = videoData.streamable_url;
                    } else if (videoData.embed_url) {
                        videoUrl = videoData.embed_url;
                    } else if (videoData.youtube_id) {
                        videoUrl = `https://www.youtube.com/embed/${videoData.youtube_id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3`;
                    } else {
                        videoUrl = videoData.video_url || '';
                    }

                    console.log('🎬 URL do vídeo:', videoUrl);

                    // 🔥 INICIAR O FLUXO: ANÚNCIO → VÍDEO
                    startClickadillaAd();

                    // Registrar view
                    await registerView(videoId);

                    // Carregar recomendados
                    await loadRelated(videoId);

                    return videoData;

                } catch (err) {
                    console.error('Erro loadVideo:', err);
                    dom.videoTitle.textContent = 'Erro ao carregar vídeo';
                    dom.videoDescription.textContent = err.message || 'Tente novamente mais tarde.';
                    dom.adContainer.innerHTML = `
                        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#e50914;gap:12px;">
                            <i class="fas fa-exclamation-triangle" style="font-size:40px;"></i>
                            <span>${err.message || 'Erro ao carregar'}</span>
                            <button onclick="location.reload()" style="padding:10px 24px;background:#e50914;border:none;border-radius:20px;color:#fff;cursor:pointer;font-weight:600;">Tentar novamente</button>
                        </div>
                    `;
                    showToast('Erro ao carregar vídeo', true);
                    return null;
                }
            }

            // ============================================================
            // REGISTRAR VIEW
            // ============================================================
            async function registerView(videoId) {
                try {
                    const resp = await fetch(`${CONFIG.apiBase}/video/${videoId}/view`, {
                        method: 'POST'
                    });
                    if (!resp.ok) throw new Error('Erro ao registrar view');

                    const data = await resp.json();
                    if (data.views) {
                        dom.videoViews.innerHTML = `<i class="fas fa-eye"></i> ${formatViews(data.views)} visualizações`;
                        dom.videoBadge.textContent = `${formatViews(data.views)} views`;
                    }
                } catch (err) {
                    console.warn('Erro ao registrar view:', err);
                }
            }

            // ============================================================
            // CARREGAR RECOMENDADOS
            // ============================================================
            async function loadRelated(videoId) {
                dom.relatedGrid.innerHTML = `
                    <div class="loading-state">
                        <i class="fas fa-spinner"></i> Carregando recomendados...
                    </div>
                `;

                try {
                    const resp = await fetch(`${CONFIG.apiBase}/videos/popular?limit=${CONFIG.relatedLimit}`);
                    if (!resp.ok) throw new Error('Erro ao carregar recomendados');

                    const data = await resp.json();
                    const videos = data.videos || [];
                    const filtered = videos.filter(v => v.id !== videoId);

                    if (filtered.length === 0) {
                        dom.relatedGrid.innerHTML = `
                            <div class="empty-state" style="grid-column:1/-1;">
                                <i class="fas fa-info-circle"></i>
                                <h4>Sem recomendações</h4>
                                <p>Volte mais tarde para mais vídeos.</p>
                            </div>
                        `;
                        return;
                    }

                    const fragment = document.createDocumentFragment();
                    filtered.forEach(v => {
                        const card = document.createElement('div');
                        card.className = 'related-card';
                        card.dataset.id = v.id;
                        
                        let thumb = v.thumbnail || '';
                        if (!thumb || thumb.includes('dQw4w9WgXcQ')) {
                            if (v.isStreamable) {
                                thumb = 'https://placehold.co/320x180/1a2d42/64b5f6?text=Streamable';
                            } else {
                                thumb = 'https://placehold.co/320x180/1a2d42/64b5f6?text=DSO';
                            }
                        }
                        
                        card.innerHTML = `
                            <div class="thumb">
                                <img src="${thumb}" 
                                     alt="${v.titulo || 'Vídeo'}"
                                     loading="lazy"
                                     onerror="this.src='https://placehold.co/320x180/1a2d42/64b5f6?text=DSO'">
                                <div class="play-icon"><i class="fas fa-play"></i></div>
                            </div>
                            <div class="info">
                                <h4>${v.titulo || 'Sem título'}</h4>
                                <div class="views">
                                    <i class="fas fa-eye"></i> ${formatViews(v.views || 0)}
                                </div>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            window.location.href = `/video/${v.id}`;
                        });
                        fragment.appendChild(card);
                    });

                    dom.relatedGrid.innerHTML = '';
                    dom.relatedGrid.appendChild(fragment);

                } catch (err) {
                    console.error('Erro loadRelated:', err);
                    dom.relatedGrid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <i class="fas fa-exclamation-triangle" style="color:#ff9800;"></i>
                            <h4>Erro ao carregar recomendações</h4>
                            <p>Tente novamente mais tarde.</p>
                        </div>
                    `;
                }
            }

            // ============================================================
            // EVENTOS DO BOTÃO SKIP
            // ============================================================
            dom.adSkipBtn.addEventListener('click', skipAd);

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            async function init() {
                const videoId = getVideoIdFromUrl();

                if (!videoId) {
                    dom.videoTitle.textContent = 'ID do vídeo não encontrado';
                    dom.videoDescription.textContent = 'URL inválida. Volte para a lista de vídeos.';
                    dom.adContainer.innerHTML = `
                        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#ff9800;gap:12px;">
                            <i class="fas fa-exclamation-triangle" style="font-size:40px;"></i>
                            <span>ID do vídeo não encontrado</span>
                            <a href="/videos" style="color:#64b5f6;text-decoration:none;">Voltar para a lista</a>
                        </div>
                    `;
                    dom.relatedGrid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <i class="fas fa-info-circle"></i>
                            <h4>Nenhum vídeo selecionado</h4>
                            <p><a href="/videos" style="color:#64b5f6;text-decoration:none;">Voltar para a lista</a></p>
                        </div>
                    `;
                    return;
                }

                // Carregar vídeo
                await loadVideo(videoId);
            }

            // Iniciar
            init();

            // Expor para debug
            window.__videoPlayer = { loadVideo, loadRelated, registerView, skipAd };

        })();
    </script>

</body>
</html>

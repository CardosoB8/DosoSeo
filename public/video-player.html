<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <script async src="https://js.wpadmngr.com/static/adManager.js" data-admpid="459377"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSO Vídeos - Player</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script async src="https://js.wpadmngr.com/static/adManager.js" data-admpid="452853"></script>

    <script>
        (function() {
            window.clickadillaConfig = {
                selector: '#playerContainer',
                autoLoad: true
            };
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0f1a2e, #1a2d4a);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(100, 181, 246, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #e50914;
            text-decoration: none;
        }

        .header .logo i { font-size: 26px; }
        .header .logo span { color: #64b5f6; }

        .header .back-link {
            color: #64b5f6;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(100, 181, 246, 0.08);
        }

        .header .back-link:hover {
            color: #e50914;
            background: rgba(229, 9, 20, 0.1);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        .banner-slot {
            text-align: center;
            padding: 12px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-wrapper {
            background: #0a0f1a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(100, 181, 246, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
            position: relative;
        }

        .player-wrapper .player-container {
            position: relative;
            width: 100%;
            background: #000;
            transition: padding-top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-container.ratio-16-9 { padding-top: 56.25%; }
        .player-container.ratio-9-16 { padding-top: 177.78%; max-height: 80vh; }
        .player-container.ratio-4-3  { padding-top: 75%; }
        .player-container.ratio-1-1  { padding-top: 100%; max-height: 80vh; }
        .player-container.ratio-21-9 { padding-top: 42.85%; }
        .player-container.ratio-auto { padding-top: 56.25%; }

        .player-wrapper .player-container iframe#videoIframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            z-index: 5;
        }

        #playOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            z-index: 20;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #playOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #playOverlay .play-btn {
            width: 80px;
            height: 80px;
            background: rgba(229, 9, 20, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
            transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.5); }
            70% { box-shadow: 0 0 0 25px rgba(229, 9, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        #playOverlay .play-btn:hover {
            transform: scale(1.1);
            background: #e50914;
            animation: none;
            box-shadow: 0 0 40px rgba(229, 9, 20, 0.5);
        }

        #playOverlay .play-label {
            color: #fff;
            font-size: 14px;
            margin-top: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        #playOverlay .ad-badge {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(229, 9, 20, 0.9);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: badgePulse 2s infinite;
        }

        @keyframes badgePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .video-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: opacity 0.6s ease;
        }

        .video-preview.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .video-info {
            padding: 20px 24px 24px;
            background: #14233a;
            border-top: 1px solid rgba(100, 181, 246, 0.06);
        }

        .video-info .title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .video-info .meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #78909c;
        }

        .video-info .meta .views i,
        .video-info .meta .date i {
            color: #64b5f6;
            margin-right: 6px;
        }

        .video-info .meta .badge-views {
            background: rgba(229, 9, 14, 0.12);
            color: #e50914;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .video-info .description {
            color: #b0bec5;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .related-section { margin-top: 32px; }

        .related-section .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e0e0e0;
        }

        .related-section .section-title i {
            color: #e50914;
            font-size: 20px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .related-card {
            background: #14233a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(100, 181, 246, 0.06);
        }

        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(229, 9, 20, 0.2);
        }

        .related-card .thumb {
            position: relative;
            padding-top: 56.25%;
            background: #0a0f1a;
        }

        .related-card .thumb img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-card .thumb .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(229, 9, 20, 0.85);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .related-card .thumb .play-icon i {
            color: #fff;
            font-size: 15px;
            margin-left: 2px;
        }

        .related-card:hover .thumb .play-icon { opacity: 1; }

        .related-card .info { padding: 10px 12px 12px; }

        .related-card .info h4 {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .related-card .info .views {
            font-size: 11px;
            color: #78909c;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .related-card .info .views i { font-size: 12px; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2d42;
            color: #e0e0e0;
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid rgba(100, 181, 246, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: toastFade 2.8s ease forwards;
            z-index: 999;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i { color: #4caf50; font-size: 18px; }
        .toast.error i { color: #e50914; }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            12% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            gap: 16px;
            color: #78909c;
            font-size: 15px;
        }

        .loading-state i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #78909c;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: #2a3d5f;
        }

        .empty-state h4 {
            font-size: 17px;
            color: #b0bec5;
            margin-bottom: 4px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header .logo { font-size: 17px; }
            .header .logo i { font-size: 22px; }
            .header .back-link { font-size: 13px; padding: 4px 10px; }
            .container { padding: 12px 12px 40px; }
            .video-info { padding: 16px 16px 20px; }
            .video-info .title { font-size: 18px; }
            .video-info .meta { font-size: 13px; gap: 12px 16px; }
            .related-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            #playOverlay .play-btn { width: 60px; height: 60px; font-size: 28px; }
            .player-container.ratio-9-16 { max-height: 70vh; }
            .player-container.ratio-1-1 { max-height: 70vh; }
        }

        @media (max-width: 480px) {
            .header .logo { font-size: 15px; }
            .header .back-link span { display: none; }
            .video-info .title { font-size: 16px; }
            .related-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .related-card .info h4 { font-size: 12px; }
            #playOverlay .play-btn { width: 50px; height: 50px; font-size: 22px; }
            #playOverlay .play-label { font-size: 12px; }
            .player-container.ratio-9-16 { max-height: 60vh; }
            .player-container.ratio-1-1 { max-height: 60vh; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="/videos" class="logo">
            <i class="fas fa-film"></i>
            DSO <span>Vídeos</span>
        </a>
        <a href="/videos" class="back-link">
            <i class="fas fa-arrow-left"></i>
            <span>Voltar para vídeos</span>
        </a>
    </header>

    <div class="banner-slot" data-banner-id="1500401"></div>

    <div class="container">

        <div class="player-wrapper" id="playerWrapper">
            <div class="player-container ratio-16-9" id="playerContainer">

                <div class="video-preview" id="videoPreview"></div>

                <div id="playOverlay">
                    <div class="ad-badge" id="adBadge" style="display:none;">
                        <i class="fas fa-ad"></i> Anúncio
                    </div>
                    <div class="play-btn" id="playBtn">
                        <i class="fas fa-play"></i>
                    </div>
                    <div class="play-label" id="playLabel">Clique para reproduzir</div>
                </div>

                <iframe id="videoIframe" src="about:blank"
                        allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                </iframe>
            </div>

            <div class="video-info" id="videoInfo">
                <div class="title" id="videoTitle">Carregando...</div>
                <div class="meta">
                    <span class="views" id="videoViews"><i class="fas fa-eye"></i> 0 visualizações</span>
                    <span class="date" id="videoDate"><i class="far fa-calendar-alt"></i> —</span>
                    <span class="badge-views" id="videoBadge">Carregando...</span>
                </div>
                <div class="description" id="videoDescription"></div>
            </div>
        </div>

        <div class="banner-slot" data-banner-id="1500403"></div>

        <div class="related-section">
            <div class="section-title">
                <i class="fas fa-list-ul"></i> Recomendados para você
            </div>
            <div class="related-grid" id="relatedGrid">
                <div class="loading-state">
                    <i class="fas fa-spinner"></i> Carregando recomendados...
                </div>
            </div>
        </div>

        <div class="banner-slot" data-banner-id="1500404"></div>
    </div>

    <div id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            const CONFIG = {
                relatedLimit: 8,
                apiBase: '/api',
                adMaxDuration: 30,
                adCheckTimeout: 8000,
                adCooldownMs: 3 * 60 * 1000,
                adStorageKey: 'dso_last_ad_time',
                defaultRatio: '16-9'
            };

            const $ = (sel) => document.querySelector(sel);
            const dom = {
                videoIframe: $('#videoIframe'),
                playOverlay: $('#playOverlay'),
                playBtn: $('#playBtn'),
                playLabel: $('#playLabel'),
                adBadge: $('#adBadge'),
                videoTitle: $('#videoTitle'),
                videoViews: $('#videoViews'),
                videoDate: $('#videoDate'),
                videoBadge: $('#videoBadge'),
                videoDescription: $('#videoDescription'),
                relatedGrid: $('#relatedGrid'),
                toastContainer: $('#toastContainer'),
                playerContainer: $('#playerContainer'),
                videoPreview: $('#videoPreview')
            };

            let state = {
                videoUrl: '',
                videoData: null,
                adShown: false,
                adSkipped: false,
                adCompleted: false,
                isPlaying: false,
                adStartTime: 0,
                monitorIntervalId: null,
                userClicked: false,
                adDetected: false,
                adBlockedByCooldown: false,
                videoRatio: CONFIG.defaultRatio
            };

            function showToast(message, isError = false) {
                const toast = document.createElement('div');
                toast.className = `toast ${isError ? 'error' : ''}`;
                toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
                dom.toastContainer.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2800);
            }

            function formatViews(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
                return num.toString();
            }

            function formatDate(iso) {
                if (!iso) return '—';
                const d = new Date(iso);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function getVideoIdFromUrl() {
                const path = window.location.pathname;
                const parts = path.split('/');
                return parts[parts.length - 1] || null;
            }

            function detectVideoRatio() {
                const data = state.videoData;
                if (!data) return CONFIG.defaultRatio;
                if (data.streamable_url) return '16-9';
                if (data.youtube_id) return '16-9';
                const text = ((data.titulo || '') + ' ' + (data.descricao || '')).toLowerCase();
                if (text.includes('shorts') || text.includes('vertical') || text.includes('tiktok') || text.includes('reels')) return '9-16';
                if (text.includes('quadrado') || text.includes('square')) return '1-1';
                if (text.includes('cinema') || text.includes('ultrawide')) return '21-9';
                return CONFIG.defaultRatio;
            }

            function applyRatio(ratio) {
                state.videoRatio = ratio;
                dom.playerContainer.className = 'player-container';
                dom.playerContainer.classList.add(`ratio-${ratio}`);
            }

            function createPlaceholder(title) {
                const safeTitle = (title || 'Vídeo').substring(0, 30).replace(/[<>&"']/g, '');
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0f1a2e"/><stop offset="100%" style="stop-color:#1a2d4a"/></linearGradient><linearGradient id="ic" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#64b5f6" stop-opacity="0.8"/><stop offset="100%" style="stop-color:#e50914" stop-opacity="0.8"/></linearGradient></defs><rect width="640" height="360" fill="url(#bg)"/><circle cx="320" cy="150" r="45" fill="none" stroke="url(#ic)" stroke-width="3" opacity="0.6"/><polygon points="305,130 305,170 345,150" fill="url(#ic)" opacity="0.8"/><text x="320" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64b5f6" text-anchor="middle">${safeTitle}</text><text x="320" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#78909c" text-anchor="middle">DSO Vídeos</text></svg>`;
                return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
            }

            function generateThumbnail(data) {
                if (data.thumbnail && !data.thumbnail.includes('dQw4w9WgXcQ')) return data.thumbnail;
                if (data.youtube_id) return `https://img.youtube.com/vi/${data.youtube_id}/hqdefault.jpg`;
                return createPlaceholder(data.titulo || 'Vídeo');
            }

            function setPreview(thumbnail) {
                dom.videoPreview.style.backgroundImage = `url('${thumbnail}')`;
                dom.videoPreview.classList.remove('hidden');
            }

            function hidePreview() {
                dom.videoPreview.classList.add('hidden');
            }

            function getLastAdTime() {
                try {
                    return parseInt(localStorage.getItem(CONFIG.adStorageKey) || '0', 10);
                } catch(e) { return 0; }
            }

            function setLastAdTime() {
                try {
                    localStorage.setItem(CONFIG.adStorageKey, Date.now().toString());
                } catch(e) {}
            }

            function canShowAd() {
                return (Date.now() - getLastAdTime()) >= CONFIG.adCooldownMs;
            }

            function detectClickadillaOverlay() {
                const selectors = [
                    '[id^="clickadilla"]',
                    '[class*="clickadilla"]',
                    '[id*="clickadilla"]',
                    'iframe[src*="clickadilla"]',
                    'iframe[src*="clickamarty"]',
                    'iframe[src*="tubecorporate"]'
                ];
                for (const sel of selectors) {
                    const els = document.querySelectorAll(sel);
                    for (const el of els) {
                        const style = window.getComputedStyle(el);
                        const rect = el.getBoundingClientRect();
                        if (style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 50 && rect.height > 50) {
                            return el;
                        }
                    }
                }
                return null;
            }

            let overlayObserver = null;
            let overlayCheckInterval = null;

            function startOverlayDetection(onDetected) {
                stopOverlayDetection();

                const check = () => {
                    const overlay = detectClickadillaOverlay();
                    if (overlay) {
                        onDetected(overlay);
                        return true;
                    }
                    return false;
                };

                if (check()) return;

                overlayObserver = new MutationObserver(() => {
                    if (check()) stopOverlayDetection();
                });

                overlayObserver.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['style', 'class']
                });

                let elapsed = 0;
                overlayCheckInterval = setInterval(() => {
                    elapsed += 300;
                    if (check()) {
                        stopOverlayDetection();
                    } else if (elapsed >= CONFIG.adCheckTimeout) {
                        stopOverlayDetection();
                    }
                }, 300);
            }

            function stopOverlayDetection() {
                if (overlayObserver) {
                    overlayObserver.disconnect();
                    overlayObserver = null;
                }
                if (overlayCheckInterval) {
                    clearInterval(overlayCheckInterval);
                    overlayCheckInterval = null;
                }
            }

            function triggerClickadillaAd() {
                const container = dom.playerContainer;
                if (!container) return;
                try {
                    container.dispatchEvent(new MouseEvent('click', {
                        bubbles: true,
                        cancelable: true,
                        view: window
                    }));
                } catch(e) {}
            }

            function playVideo() {
                if (state.isPlaying) return;
                state.isPlaying = true;

                dom.playOverlay.classList.add('hidden');
                hidePreview();

                dom.videoIframe.style.display = 'block';

                if (state.videoUrl) {
                    if (dom.videoIframe.src === 'about:blank' || dom.videoIframe.src === '') {
                        dom.videoIframe.src = state.videoUrl;
                    } else if (dom.videoIframe.src !== state.videoUrl) {
                        dom.videoIframe.src = state.videoUrl;
                    }
                }
            }

            function showAd() {
                if (state.adShown) return;
                state.adShown = true;
                state.adStartTime = Date.now();

                dom.playOverlay.classList.add('hidden');
                hidePreview();
                dom.videoIframe.style.display = 'none';

                dom.adBadge.style.display = 'flex';
                dom.adBadge.innerHTML = '<i class="fas fa-ad"></i> Anúncio';

                triggerClickadillaAd();

                startOverlayDetection((overlay) => {
                    state.adDetected = true;
                });

                startAdMonitoring();
            }

            function finishAd() {
                if (state.adSkipped || state.adCompleted) return;
                state.adCompleted = true;
                setLastAdTime();
                if (state.monitorIntervalId) {
                    clearInterval(state.monitorIntervalId);
                    state.monitorIntervalId = null;
                }
                stopOverlayDetection();
                playVideo();
            }

            function startAdMonitoring() {
                if (state.monitorIntervalId) {
                    clearInterval(state.monitorIntervalId);
                    state.monitorIntervalId = null;
                }

                let overlayWasVisible = false;

                state.monitorIntervalId = setInterval(() => {
                    const overlay = detectClickadillaOverlay();
                    const elapsed = (Date.now() - state.adStartTime) / 1000;

                    if (overlay) {
                        overlayWasVisible = true;
                    }

                    if (overlayWasVisible && !overlay && elapsed > 2) {
                        finishAd();
                        return;
                    }

                    if (elapsed > CONFIG.adMaxDuration) {
                        finishAd();
                    }
                }, 800);

                setTimeout(() => {
                    if (!state.adSkipped && !state.adCompleted) {
                        finishAd();
                    }
                }, CONFIG.adMaxDuration * 1000 + 2000);
            }

            function checkAdInBackground() {
                if (!canShowAd()) {
                    state.adBlockedByCooldown = true;
                    state.adDetected = false;
                    dom.adBadge.style.display = 'none';
                    dom.playLabel.textContent = 'Clique para reproduzir';
                    return;
                }

                state.adBlockedByCooldown = false;

                startOverlayDetection(() => {
                    state.adDetected = true;
                    dom.adBadge.style.display = 'flex';
                    dom.adBadge.innerHTML = '<i class="fas fa-ad"></i> Assistir anúncio';
                    dom.playLabel.textContent = 'Clique para assistir ao anúncio';
                });
            }

            function handlePlayClick() {
                if (state.isPlaying) return;
                state.userClicked = true;

                if (state.adBlockedByCooldown) {
                    playVideo();
                    return;
                }

                if (state.adDetected && canShowAd()) {
                    showAd();
                    return;
                }

                playVideo();
            }

            async function loadVideo(videoId) {
                try {
                    const resp = await fetch(`${CONFIG.apiBase}/video/${videoId}`);
                    if (!resp.ok) {
                        if (resp.status === 404) throw new Error('Vídeo não encontrado');
                        throw new Error('Erro ao carregar vídeo');
                    }

                    state.videoData = await resp.json();

                    dom.videoTitle.textContent = state.videoData.titulo || 'Sem título';
                    dom.videoViews.innerHTML = `<i class="fas fa-eye"></i> ${formatViews(state.videoData.views || 0)} visualizações`;
                    dom.videoDate.innerHTML = `<i class="far fa-calendar-alt"></i> ${formatDate(state.videoData.criado_em)}`;
                    dom.videoBadge.textContent = `${formatViews(state.videoData.views || 0)} views`;
                    dom.videoDescription.textContent = state.videoData.descricao || '';

                    applyRatio(detectVideoRatio());
                    setPreview(generateThumbnail(state.videoData));

                    if (state.videoData.streamable_url) {
                        state.videoUrl = state.videoData.streamable_url;
                    } else if (state.videoData.embed_url) {
                        state.videoUrl = state.videoData.embed_url;
                    } else if (state.videoData.youtube_id) {
                        state.videoUrl = `https://www.youtube.com/embed/${state.videoData.youtube_id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3`;
                    } else {
                        state.videoUrl = state.videoData.video_url || '';
                    }

                    checkAdInBackground();
                    await registerView(videoId);
                    await loadRelated(videoId);

                    return state.videoData;
                } catch (err) {
                    dom.videoTitle.textContent = 'Erro ao carregar vídeo';
                    dom.videoDescription.textContent = err.message || 'Tente novamente mais tarde.';
                    dom.playOverlay.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;"><i class="fas fa-exclamation-triangle" style="font-size:40px;color:#e50914;margin-bottom:12px;"></i><span style="color:#e0e0e0;font-size:16px;">${err.message || 'Erro ao carregar'}</span><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:#e50914;border:none;border-radius:20px;color:#fff;cursor:pointer;font-weight:600;">Tentar novamente</button></div>`;
                    showToast('Erro ao carregar vídeo', true);
                    return null;
                }
            }

            async function registerView(videoId) {
                try {
                    const resp = await fetch(`${CONFIG.apiBase}/video/${videoId}/view`, { method: 'POST' });
                    if (!resp.ok) throw new Error('Erro');
                    const data = await resp.json();
                    if (data.views) {
                        dom.videoViews.innerHTML = `<i class="fas fa-eye"></i> ${formatViews(data.views)} visualizações`;
                        dom.videoBadge.textContent = `${formatViews(data.views)} views`;
                    }
                } catch (err) {}
            }

            async function loadRelated(videoId) {
                dom.relatedGrid.innerHTML = `<div class="loading-state"><i class="fas fa-spinner"></i> Carregando recomendados...</div>`;

                try {
                    const resp = await fetch(`${CONFIG.apiBase}/videos/popular?limit=${CONFIG.relatedLimit}`);
                    if (!resp.ok) throw new Error('Erro');

                    const data = await resp.json();
                    const videos = data.videos || [];
                    const filtered = videos.filter(v => v.id !== videoId);

                    if (filtered.length === 0) {
                        dom.relatedGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-info-circle"></i><h4>Sem recomendações</h4><p>Volte mais tarde para mais vídeos.</p></div>`;
                        return;
                    }

                    const fragment = document.createDocumentFragment();
                    filtered.forEach(v => {
                        const card = document.createElement('div');
                        card.className = 'related-card';
                        card.dataset.id = v.id;

                        let thumb = v.thumbnail || '';
                        if (!thumb || thumb.includes('dQw4w9WgXcQ')) {
                            thumb = createPlaceholder(v.titulo || 'Vídeo');
                        }

                        card.innerHTML = `<div class="thumb"><img src="${thumb}" alt="${v.titulo || 'Vídeo'}" loading="lazy" onerror="this.src='${createPlaceholder(v.titulo || 'Vídeo')}'"><div class="play-icon"><i class="fas fa-play"></i></div></div><div class="info"><h4>${v.titulo || 'Sem título'}</h4><div class="views"><i class="fas fa-eye"></i> ${formatViews(v.views || 0)}</div></div>`;

                        card.addEventListener('click', () => {
                            window.location.href = `/video/${v.id}`;
                        });
                        fragment.appendChild(card);
                    });

                    dom.relatedGrid.innerHTML = '';
                    dom.relatedGrid.appendChild(fragment);
                } catch (err) {
                    dom.relatedGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-triangle" style="color:#ff9800;"></i><h4>Erro ao carregar recomendações</h4><p>Tente novamente mais tarde.</p></div>`;
                }
            }

            dom.playOverlay.addEventListener('click', handlePlayClick);
            dom.playBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                handlePlayClick();
            });

            async function init() {
                const videoId = getVideoIdFromUrl();

                if (!videoId) {
                    dom.videoTitle.textContent = 'ID do vídeo não encontrado';
                    dom.videoDescription.textContent = 'URL inválida. Volte para a lista de vídeos.';
                    dom.playOverlay.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;"><i class="fas fa-exclamation-triangle" style="font-size:40px;color:#ff9800;margin-bottom:12px;"></i><span style="color:#e0e0e0;font-size:16px;">ID do vídeo não encontrado</span><a href="/videos" style="margin-top:12px;color:#64b5f6;text-decoration:none;">Voltar para a lista</a></div>`;
                    dom.relatedGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-info-circle"></i><h4>Nenhum vídeo selecionado</h4><p><a href="/videos" style="color:#64b5f6;text-decoration:none;">Voltar para a lista</a></p></div>`;
                    return;
                }

                await loadVideo(videoId);
            }

            init();

            window.__videoPlayer = { loadVideo, loadRelated, registerView, playVideo, state };

        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSO Vídeos - Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0f1a2e, #1a2d4a);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(100, 181, 246, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: #e50914;
            text-decoration: none;
        }

        .header .logo i { font-size: 28px; }
        .header .logo span { color: #64b5f6; }

        .header .back-home {
            color: #64b5f6;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .header .back-home:hover { color: #e50914; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(100, 181, 246, 0.1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        .player-wrapper iframe,
        .player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-wrapper .player-error {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #78909c;
            text-align: center;
            padding: 20px;
        }

        .player-wrapper .player-error i {
            font-size: 48px;
            color: #e50914;
        }

        .video-info {
            margin-top: 24px;
            padding: 20px;
            background: #14233a;
            border-radius: 14px;
            border: 1px solid rgba(100, 181, 246, 0.06);
        }

        .video-info h1 {
            font-size: 22px;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            color: #78909c;
            font-size: 14px;
        }

        .video-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-meta i { color: #64b5f6; }

        .video-description {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(100, 181, 246, 0.08);
            color: #b0bec5;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            gap: 16px;
            color: #78909c;
            font-size: 16px;
        }

        .loading i {
            font-size: 28px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #78909c;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: #2a3d5f;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #b0bec5;
            margin-bottom: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2d42;
            color: #e0e0e0;
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid rgba(100, 181, 246, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: toastFade 2.8s ease forwards;
            z-index: 999;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i { color: #4caf50; font-size: 18px; }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            12% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header .logo { font-size: 18px; }
            .container { padding: 12px 12px 40px; }
            .video-info { padding: 16px; }
            .video-info h1 { font-size: 18px; }
        }

        /* Player vertical (Streamable portrait) */
        .player-wrapper.portrait {
            padding-bottom: 177.78%;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="/" class="logo">
            <i class="fas fa-film"></i>
            DSO <span>Vídeos</span>
        </a>
        <a href="/" class="back-home">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </header>

    <div class="container">
        <div id="playerContainer">
            <div class="loading" id="loadingIndicator">
                <i class="fas fa-spinner"></i> Carregando vídeo...
            </div>
        </div>

        <div id="videoInfo" style="display:none;"></div>
    </div>

    <div id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            const CONFIG = {
                apiBase: '/api'
            };

            const $ = (sel) => document.querySelector(sel);
            const dom = {
                playerContainer: $('#playerContainer'),
                videoInfo: $('#videoInfo'),
                loading: $('#loadingIndicator'),
                toastContainer: $('#toastContainer')
            };

            function showToast(message, icon = 'fa-check-circle') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
                dom.toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 2800);
            }

            function formatViews(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
                return num.toString();
            }

            function formatDate(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            function getVideoIdFromUrl() {
                const params = new URLSearchParams(window.location.search);
                if (params.get('id')) return params.get('id');
                if (params.get('url')) return params.get('url');
                const path = window.location.pathname;
                const match = path.match(/\/video\/([^\/]+)/);
                return match ? match[1] : null;
            }

            function extractYouTubeId(url) {
                if (!url) return null;
                const patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
                    /^([a-zA-Z0-9_-]{11})$/
                ];
                for (const p of patterns) {
                    const m = url.match(p);
                    if (m) return m[1];
                }
                return null;
            }

            function extractVimeoId(url) {
                const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
                return m ? m[1] : null;
            }

            function extractStreamableId(url) {
                const m = url.match(/streamable\.com\/(?:e\/)?([a-zA-Z0-9]+)/);
                return m ? m[1] : null;
            }

            function extractDailymotionId(url) {
                const m = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
                return m ? m[1] : null;
            }

            function isDirectVideo(url) {
                return /\.(mp4|webm|ogg|mov|m3u8)(\?.*)?$/i.test(url);
            }

            /**
             * Cria o elemento do player com base na URL.
             * Retorna { el, portrait }
             */
            function createPlayerFromUrl(url) {
                if (!url) return null;

                // 1) Streamable
                const streamableId = extractStreamableId(url);
                if (streamableId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://streamable.com/e/${streamableId}?autoplay=1`;
                    iframe.allow = 'fullscreen';
                    iframe.allowFullscreen = true;
                    // Vídeos do Streamable geralmente são verticais
                    return { el: iframe, portrait: true };
                }

                // 2) YouTube
                const ytId = extractYouTubeId(url);
                if (ytId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
                    iframe.allowFullscreen = true;
                    return { el: iframe, portrait: false };
                }

                // 3) Vimeo
                const vimeoId = extractVimeoId(url);
                if (vimeoId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://player.vimeo.com/video/${vimeoId}?autoplay=1`;
                    iframe.allow = 'autoplay; fullscreen; picture-in-picture';
                    iframe.allowFullscreen = true;
                    return { el: iframe, portrait: false };
                }

                // 4) Dailymotion
                const dmId = extractDailymotionId(url);
                if (dmId) {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.dailymotion.com/embed/video/${dmId}?autoplay=1`;
                    iframe.allow = 'autoplay; fullscreen';
                    iframe.allowFullscreen = true;
                    return { el: iframe, portrait: false };
                }

                // 5) Vídeo direto (mp4, webm, etc.)
                if (isDirectVideo(url)) {
                    const video = document.createElement('video');
                    video.src = url;
                    video.controls = true;
                    video.autoplay = true;
                    video.playsInline = true;
                    video.setAttribute('controlsList', 'nodownload');
                    return { el: video, portrait: false };
                }

                // 6) URL genérica que retorna iframe/embed (fallback)
                if (/^https?:\/\//i.test(url)) {
                    const iframe = document.createElement('iframe');
                    iframe.src = url;
                    iframe.allow = 'fullscreen; autoplay; encrypted-media';
                    iframe.allowFullscreen = true;
                    return { el: iframe, portrait: false };
                }

                return null;
            }

            function renderError(message) {
                dom.playerContainer.innerHTML = `
                    <div class="player-wrapper">
                        <div class="player-error">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>${message}</p>
                        </div>
                    </div>
                `;
            }

            function renderPlayer(url, videoData) {
                const player = createPlayerFromUrl(url);

                if (!player) {
                    renderError('Formato de vídeo não suportado.');
                    return;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'player-wrapper' + (player.portrait ? ' portrait' : '');
                wrapper.appendChild(player.el);

                dom.playerContainer.innerHTML = '';
                dom.playerContainer.appendChild(wrapper);

                // Renderiza info do vídeo (se disponível)
                if (videoData) {
                    renderVideoInfo(videoData);
                }
            }

            function renderVideoInfo(video) {
                dom.videoInfo.style.display = 'block';
                dom.videoInfo.innerHTML = `
                    <div class="video-info">
                        <h1>${video.titulo || 'Sem título'}</h1>
                        <div class="video-meta">
                            <span><i class="fas fa-eye"></i> ${formatViews(video.views || 0)} visualizações</span>
                            <span><i class="fas fa-calendar"></i> ${formatDate(video.criado_em) || '—'}</span>
                            <span><i class="fas fa-play-circle"></i> ${video.fonte || 'Vídeo'}</span>
                        </div>
                        ${video.descricao ? `<div class="video-description">${video.descricao}</div>` : ''}
                    </div>
                `;
            }

            async function loadVideo() {
                const id = getVideoIdFromUrl();

                // Se o parâmetro for uma URL completa, carrega direto
                if (id && /^https?:\/\//i.test(id)) {
                    const decoded = decodeURIComponent(id);
                    renderPlayer(decoded, null);
                    return;
                }

                // Caso contrário, busca os dados na API
                if (!id) {
                    renderError('Nenhum vídeo especificado.');
                    return;
                }

                try {
                    const resp = await fetch(`${CONFIG.apiBase}/videos/${encodeURIComponent(id)}`);
                    if (!resp.ok) throw new Error('Vídeo não encontrado');

                    const video = await resp.json();
                    const url = video.url || video.video_url || video.stream_url || video.embed_url;

                    if (!url) {
                        renderError('Este vídeo não possui uma URL válida.');
                        return;
                    }

                    renderPlayer(url, video);

                    // Incrementa view (opcional)
                    fetch(`${CONFIG.apiBase}/videos/${encodeURIComponent(id)}/view`, {
                        method: 'POST'
                    }).catch(() => {});

                } catch (err) {
                    console.error('Erro loadVideo:', err);
                    showToast('Erro ao carregar vídeo', 'fa-exclamation-circle');
                    renderError('Não foi possível carregar o vídeo.');
                }
            }

            // Suporte: se o usuário colar uma URL direto na barra (ex: /player?url=...)
            function init() {
                loadVideo();
            }

            init();

            window.__videoPlayer = { loadVideo, createPlayerFromUrl, renderPlayer };

        })();
    </script>

</body>
</html>
